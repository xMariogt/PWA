<div class="group rounded-lg border bg-white">
    <a class="w-full overflow-hidden rounded-t-lg">
        <img [src]="product.image" [alt]="product.title" class="h-full w-full aspect-square object-cover object-center group-hover:opacity-75">
    </a>
    <div class="flex flex-col justify-between p-4 min-h-[180px]">
        <h3 class="text-sm font-medium text-black">{{ product.title | uppercase }}</h3>
        <p class="text-lg font-medium text-black">{{ product.price | currency:'Q':'symbol':'1.2'}}</p>
        <button (click)="addToCartHandler()"
        class="text-white bg-green-600 font-medium rounded-lg text-lg px-2 py-2.5 whitespace-nowrap text-ellipsis overflow-hidden">Agregar</button>
    </div>
</div>
